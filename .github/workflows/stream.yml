name: Live Stream

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start-stream]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NEXT_REPO: Abdul6992/stream-a
    steps:
      - name: Install ffmpeg and gdown
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download video from Drive
        run: |
          gdown "https://drive.google.com/uc?id=${{ secrets.DRIVE_FILE_ID }}" -O video.mp4
          ls -lh video.mp4

      - name: Stream with resume offset
        run: |
          T0="${{ github.event.client_payload.t0 }}"
          if [ -z "$T0" ]; then T0=$(date +%s); fi

          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4 | cut -d. -f1)
          OFFSET=$(( ( $(date +%s) - T0 ) % DUR ))
          echo "Duration=$DUR  Offset=$OFFSET"

          REPEATS=$(( 19800 / DUR + 2 ))
          {
            echo "ffconcat version 1.0"
            echo "file 'video.mp4'"
            echo "inpoint $OFFSET"
            for i in $(seq 1 $REPEATS); do echo "file 'video.mp4'"; done
          } > list.txt

          (sleep 240 && curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$NEXT_REPO/dispatches \
            -d "{\"event_type\":\"start-stream\",\"client_payload\":{\"t0\":\"$T0\"}}") &

          timeout 300 ffmpeg -re -f concat -i list.txt \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -g 60 -keyint_min 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YT_KEY }}" || true
